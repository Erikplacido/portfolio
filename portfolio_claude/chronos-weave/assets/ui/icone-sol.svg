<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Armillary Coordinate Ring -->
    <circle cx="64" cy="64" r="50" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="64" cy="64" r="40" stroke-width="2.5" opacity="0.6"/>
    
    <!-- 8 Radiant Spear Flares -->
    <line x1="64" y1="8" x2="64" y2="22" stroke-width="3.5"/>
    <line x1="64" y1="106" x2="64" y2="120" stroke-width="3.5"/>
    <line x1="8" y1="64" x2="22" y2="64" stroke-width="3.5"/>
    <line x1="106" y1="64" x2="120" y2="64" stroke-width="3.5"/>
    <line x1="24" y1="24" x2="34" y2="34" stroke-width="3"/>
    <line x1="94" y1="94" x2="104" y2="104" stroke-width="3"/>
    <line x1="24" y1="104" x2="34" y2="94" stroke-width="3"/>
    <line x1="94" y1="34" x2="104" y2="24" stroke-width="3"/>

    <!-- Coronal Solar Crown Polygon -->
    <polygon points="64,18 73,38 94,28 88,50 110,64 88,78 94,100 73,90 64,110 55,90 34,100 40,78 18,64 40,50 34,28 55,38"
             fill="#FFFFFF" fill-opacity="0.25" stroke-width="3"/>

    <!-- Concentric Inner Solar Sphere -->
    <circle cx="64" cy="64" r="22" fill="#FFFFFF" fill-opacity="0.35" stroke-width="3"/>
    <circle cx="64" cy="64" r="12" fill="#FFFFFF" stroke-width="2"/>
    <circle cx="64" cy="64" r="4" fill="#000000" stroke="none"/>
  </g>
</svg>