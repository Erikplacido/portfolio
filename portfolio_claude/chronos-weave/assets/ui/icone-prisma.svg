             fill="#FFFFFF" fill-opacity="0.22" stroke-width="3.5"/>
             
    <line x1="20" y1="54" x2="108" y2="54" stroke-width="3"/>
    <line x1="64" y1="14" x2="64" y2="114" stroke-width="2.5"/>

