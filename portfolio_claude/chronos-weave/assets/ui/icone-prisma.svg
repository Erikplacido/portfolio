    <!-- Refracted Celestial Vector Beams -->
    <line x1="64" y1="14" x2="64" y2="6" stroke-width="3"/>
    <line x1="108" y1="54" x2="118" y2="50" stroke-width="2.5"/>
    <line x1="108" y1="54" x2="120" y2="60" stroke-width="2.5"/>
    <line x1="20" y1="54" x2="10" y2="50" stroke-width="2.5"/>
    <line x1="20" y1="54" x2="8" y2="60" stroke-width="2.5"/>
    <line x1="64" y1="114" x2="64" y2="122" stroke-width="3"/>

    <!-- Central Singular Nexus Gem -->
    <circle cx="64" cy="54" r="4.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>