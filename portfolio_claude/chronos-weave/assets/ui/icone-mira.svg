<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Segmented Astronomical Reticle Rings -->
    <circle cx="64" cy="64" r="48" stroke-width="2.5" stroke-dasharray="24 14"/>
    <circle cx="64" cy="64" r="36" stroke-width="2" opacity="0.5"/>
    <circle cx="64" cy="64" r="22" stroke-width="2.8"/>

    <!-- Precision Quadrant Brackets -->
    <path d="M42 22 L22 22 L22 42" stroke-width="2.5" opacity="0.6"/>
    <path d="M86 22 L106 22 L106 42" stroke-width="2.5" opacity="0.6"/>
    <path d="M42 106 L22 106 L22 86" stroke-width="2.5" opacity="0.6"/>
    <path d="M86 106 L106 106 L106 86" stroke-width="2.5" opacity="0.6"/>

    <!-- Crosshair Blades with Micrometer Calibration Notches -->
    <line x1="64" y1="10" x2="64" y2="38" stroke-width="3.5"/>
    <line x1="64" y1="90" x2="64" y2="118" stroke-width="3.5"/>
    <line x1="10" y1="64" x2="38" y2="64" stroke-width="3.5"/>
    <line x1="90" y1="64" x2="118" y2="64" stroke-width="3.5"/>

    <line x1="60" y1="28" x2="68" y2="28" stroke-width="2"/>
    <line x1="60" y1="100" x2="68" y2="100" stroke-width="2"/>
    <line x1="28" y1="60" x2="28" y2="68" stroke-width="2"/>
    <line x1="100" y1="60" x2="100" y2="68" stroke-width="2"/>

    <!-- Central Precision Target Diamond -->
    <polygon points="64,56 72,64 64,72 56,64" fill="#FFFFFF" stroke="none"/>
    <circle cx="64" cy="64" r="2" fill="#000000" stroke="none"/>
  </g>
</svg>