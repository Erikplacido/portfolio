<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Astrolabe Horologium Outer Dial -->
    <circle cx="64" cy="64" r="50" stroke-width="3.2"/>
    <circle cx="64" cy="64" r="44" stroke-width="1.8" stroke-dasharray="3 5" opacity="0.6"/>
    <circle cx="64" cy="64" r="34" stroke-width="2" opacity="0.4"/>

    <!-- 12 Dial Coordinate Ticks -->
    <line x1="64" y1="14" x2="64" y2="22" stroke-width="3.5"/>
    <line x1="64" y1="106" x2="64" y2="114" stroke-width="3.5"/>
    <line x1="14" y1="64" x2="22" y2="64" stroke-width="3.5"/>
    <line x1="106" y1="64" x2="114" y2="64" stroke-width="3.5"/>
    <line x1="29" y1="29" x2="35" y2="35" stroke-width="2.5"/>
    <line x1="93" y1="93" x2="99" y2="99" stroke-width="2.5"/>
    <line x1="29" y1="99" x2="35" y2="93" stroke-width="2.5"/>
    <line x1="93" y1="35" x2="99" y2="29" stroke-width="2.5"/>

    <!-- Chronos Time Hands with Diamond Pointer & Crescent Counterweight -->
    <line x1="64" y1="64" x2="64" y2="28" stroke-width="4.2"/>
    <polygon points="64,22 68,28 64,34 60,28" fill="#FFFFFF" stroke="none"/>
    
    <line x1="64" y1="64" x2="90" y2="76" stroke-width="3.8"/>
    <polygon points="94,78 88,74 88,82" fill="#FFFFFF" stroke="none"/>

    <!-- Crescent Moon Counterweight -->
    <path d="M64 74 A 8 8 0 0 1 56 64 A 10 10 0 1 0 64 78 Z" fill="#FFFFFF" stroke="none"/>

    <!-- Center Pivot Gear Disc -->
    <circle cx="64" cy="64" r="8" fill="#FFFFFF" fill-opacity="0.35" stroke-width="2.5"/>
    <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>