    <line x1="64" y1="4" x2="64" y2="12" stroke-width="3"/>
    <line x1="64" y1="116" x2="64" y2="124" stroke-width="3"/>
    <line x1="4" y1="64" x2="12" y2="64" stroke-width="3"/>
    <line x1="116" y1="64" x2="124" y2="64" stroke-width="3"/>
